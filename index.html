<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLight Control</title>
<meta name="description" content="DLight Control — إدارة حسابات DLight">
<meta name="theme-color" content="#1A1A22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DLight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#1A1A22;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;background:#1A1A22}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#1A1A22;transition:opacity .35s;z-index:2}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:168px;height:168px}
  .bar{width:120px;height:3px;background:#2A2A34;border-radius:3px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#FCD12D;border-radius:3px;animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  #off{display:none;color:#F5F5F5;font:16px/1.6 Tajawal,system-ui,sans-serif;text-align:center;padding:0 24px}
  #off button{margin-top:12px;background:#FCD12D;color:#1A1A22;border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:700}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="DLight"><div class="bar"><i></i></div>
  <div id="off">مفيش إنترنت دلوقتي.<br><button onclick="location.reload()">جرّب تاني</button></div></div>
<iframe id="app" title="DLight Control" allow="clipboard-read; clipboard-write; fullscreen" src="https://script.google.com/macros/s/AKfycbxl1bRZlh4L7kzll05TaXYdjYmm8MgBK8XRen7cjOiJEqy70b_BXEA2tZ-PCuJAojIg/exec"></iframe>
<script>
  var sp=document.getElementById('splash');
  document.getElementById('app').addEventListener('load',function(){setTimeout(function(){sp.classList.add('gone')},250)});
  if(!navigator.onLine){document.getElementById('off').style.display='block';document.querySelector('.bar').style.display='none'}
  // التطبيق بيبعت reload لما يكون فيه نسخة جديدة
  window.addEventListener('message',function(e){if(e.data&&e.data.dlc==='reload'){sp.classList.remove('gone');var f=document.getElementById('app');f.src=f.src.split('?')[0]+'?r='+Date.now()}});
  // مشاركة وتحميل الصور: التطبيق جوه إطار مش مسموحله يشارك، فبيبعت الصورة هنا والصفحة دي تشاركها
  function dataFile(u,name){var p=u.split(','),m=p[0].match(/:(.*?);/)[1],b=atob(p[1]),n=b.length,a=new Uint8Array(n);while(n--)a[n]=b.charCodeAt(n);return new File([a],name,{type:m})}
  function dl(u,name){var a=document.createElement('a'),o=URL.createObjectURL(dataFile(u,name));a.href=o;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(o)},5000)}
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||!d.dlc)return;
    var reply=function(o){try{e.source.postMessage(Object.assign({dlc:'res',id:d.id},o),'*')}catch(x){}};
    if(d.dlc==='download'){dl(d.url,d.name);reply({ok:true});return}
    if(d.dlc==='share'){
      var f;try{f=dataFile(d.url,d.name)}catch(x){reply({ok:false,err:'bad'});return}
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:d.name}).then(function(){reply({ok:true})},function(x){reply({ok:false,err:x&&x.name})});
      }else{dl(d.url,d.name);reply({ok:false,err:'nosupport',downloaded:true})}
    }
  });
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
